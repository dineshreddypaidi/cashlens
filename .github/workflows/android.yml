name: Android APK

on:
  # Build on every branch: the point of this workflow is to hand you an APK,
  # and waiting for a merge to main to get one is not useful.
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android step: the ubuntu runner image already ships the
      # Android SDK with ANDROID_HOME set. The action's default package list
      # includes the long-removed 'tools' package and fails.

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The accounting rules are shared between the Django server and the
      # device. If these drift, the phone and the server disagree about money.
      - name: Check accounting parity
        run: npm run test:rules

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cashlens-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
